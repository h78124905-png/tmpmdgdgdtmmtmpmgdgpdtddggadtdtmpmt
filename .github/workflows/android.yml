name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Configure Android Build Tools path
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS_DIR="$SDK_ROOT/build-tools/36.0.0"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          echo "$BUILD_TOOLS_DIR" >> "$GITHUB_PATH"
          echo "ANDROID_BUILD_TOOLS=$BUILD_TOOLS_DIR" >> "$GITHUB_ENV"
          apksigner --version

      - name: Install Gradle 8.13
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build signed release APK
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          test -x "$ANDROID_BUILD_TOOLS/apksigner"
          "$ANDROID_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          echo "Signed APK: $APK"
          echo "Verified with: $ANDROID_BUILD_TOOLS/apksigner"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lfm-mobile-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
