name: UI features

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  patch-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch MainActivity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/lfmmobile/MainActivity.kt')
          s = p.read_text()

          s = s.replace('import android.content.Context\n', 'import android.content.ClipData\nimport android.content.ClipboardManager\nimport android.content.Context\n')
          s = s.replace('''private data class GenerationStats(\n    val tokPerSec: Double = 0.0,\n    val elapsedMs: Long = 0L,\n    val gpu: String = "CPU",\n    val contextUsed: Int = 0,\n    val contextSize: Int = 0\n)''', '''private data class GenerationStats(\n    val tokPerSec: Double = 0.0,\n    val elapsedMs: Long = 0L,\n    val contextUsed: Int = 0,\n    val contextSize: Int = 0\n)''')
          s = s.replace('    var draft by remember { mutableStateOf(ModelSlot()) }\n', '    var draft by remember { mutableStateOf(ModelSlot()) }\n    var draftEnabled by remember { mutableStateOf(false) }\n')
          s = s.replace('''        draft = ModelSlot(uri.toString(), name)\n        loaded = false''', '''        draft = ModelSlot(uri.toString(), name)\n        draftEnabled = true\n        loaded = false''')
          s = s.replace('val draftFile = if (draft.uri.isNotEmpty()) copyModel(draft, "dspark.gguf") else null', 'val draftFile = if (draftEnabled && draft.uri.isNotEmpty()) copyModel(draft, "dspark.gguf") else null')
          s = s.replace('generationStats = GenerationStats(contextSize = contextSize)', 'generationStats = GenerationStats(contextSize = contextSize)')
          s = s.replace('''onStats = { tokPerSec, elapsedMs, gpu, contextUsed, contextMax ->\n                                channel.trySend(StreamEvent.Stats(GenerationStats(tokPerSec, elapsedMs, gpu, contextUsed, contextMax)))\n                            }''', '''onStats = { tokPerSec, elapsedMs, contextUsed, contextMax ->\n                                channel.trySend(StreamEvent.Stats(GenerationStats(tokPerSec, elapsedMs, contextUsed, contextMax)))\n                            }''')
          s = s.replace('''            if (messages.isEmpty()) item { Welcome(target, draft, loaded) }''', '''            if (messages.isEmpty()) item { Welcome(target, draft, draftEnabled, loaded) }''')
          s = s.replace('''                    ModelCard("DSpark draft (optional)", draft) { pickerDraft.launch(arrayOf("application/octet-stream", "application/x-gguf", "*/*")) }\n                    HorizontalDivider()''', '''                    ModelCard("DSpark draft (optional)", draft) { pickerDraft.launch(arrayOf("application/octet-stream", "application/x-gguf", "*/*")) }\n                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                        Column(Modifier.weight(1f)) {\n                            Text("Draft acceleration", fontWeight = FontWeight.SemiBold)\n                            Text(if (draft.uri.isEmpty()) "Select a DSpark draft model first" else if (draftEnabled) "Enabled" else "Disabled", style = MaterialTheme.typography.bodySmall)\n                        }\n                        Switch(checked = draftEnabled, onCheckedChange = { draftEnabled = it; loaded = false }, enabled = draft.uri.isNotEmpty())\n                    }\n                    HorizontalDivider()''')
          s = s.replace('''Button(onClick = { loadModel() }, enabled = target.uri.isNotEmpty()) { Text(if (draft.uri.isNotEmpty()) "Load Target + DSpark" else "Load model") }''', '''Button(onClick = { loadModel() }, enabled = target.uri.isNotEmpty()) { Text(if (draftEnabled && draft.uri.isNotEmpty()) "Load Target + DSpark" else "Load model") }''')
          s = s.replace('''private fun GenerationStatus(stats: GenerationStats) {''', '''private fun GenerationStatus(stats: GenerationStats) {''')
          s = s.replace('''            Spacer(Modifier.width(10.dp))\n            Text(stats.gpu, maxLines = 1)\n            Spacer(Modifier.width(10.dp))\n            Text("ctx ${stats.contextUsed}/${stats.contextSize}")''', '''            Spacer(Modifier.width(10.dp))\n            Text("ctx ${stats.contextUsed}/${stats.contextSize}")''')
          s = s.replace('''private fun Welcome(target: ModelSlot, draft: ModelSlot, loaded: Boolean) {\n    Column(Modifier.fillMaxWidth().padding(top = 70.dp), horizontalAlignment = Alignment.CenterHorizontally) {\n        Text("Local AI", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Medium)\n        Text(if (loaded) target.name else "Choose a Target model in Models", style = MaterialTheme.typography.bodyMedium)\n        if (loaded && draft.uri.isNotEmpty()) Text("DSpark enabled", style = MaterialTheme.typography.bodySmall)\n    }\n}''', '''private fun Welcome(target: ModelSlot, draft: ModelSlot, draftEnabled: Boolean, loaded: Boolean) {\n    Column(Modifier.fillMaxWidth().padding(top = 70.dp), horizontalAlignment = Alignment.CenterHorizontally) {\n        Text("Local AI", style = MaterialTheme.typography.headlineSmall, fontWeight = FontWeight.Medium)\n        Text(if (loaded) target.name else "Choose a Target model in Models", style = MaterialTheme.typography.bodyMedium)\n        if (loaded && draftEnabled && draft.uri.isNotEmpty()) Text("DSpark enabled", style = MaterialTheme.typography.bodySmall)\n    }\n}''')
          old = '''@Composable\nprivate fun MessageBubble(message: Message) {\n    Column(Modifier.fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(7.dp)) {\n        if (!message.user && message.thinking.isNotEmpty()) {\n            Surface(\n                modifier = Modifier.fillMaxWidth(),\n                shape = RoundedCornerShape(14.dp),\n                color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.55f)\n            ) {\n                Column(Modifier.padding(horizontal = 14.dp, vertical = 10.dp)) {\n                    Text("Thinking", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold)\n                    Text(message.thinking, Modifier.padding(top = 4.dp), style = MaterialTheme.typography.bodyMedium)\n                }\n            }\n        }\n        Row(Modifier.fillMaxWidth(), horizontalArrangement = if (message.user) Arrangement.End else Arrangement.Start) {\n            if (message.user || message.text.isNotEmpty()) {\n                Surface(\n                    shape = RoundedCornerShape(18.dp),\n                    color = if (message.user) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant\n                ) {\n                    Text(message.text, Modifier.padding(horizontal = 16.dp, vertical = 11.dp), style = MaterialTheme.typography.bodyLarge)\n                }\n            }\n        }\n        if (!message.user && message.sources.isNotEmpty()) {\n            Text(\n                "Sources: " + message.sources.mapIndexed { i, s -> "[${i + 1}] ${s.title}" }.joinToString(" • "),\n                Modifier.padding(start = 10.dp, top = 4.dp), style = MaterialTheme.typography.labelSmall\n            )\n        }\n    }\n}'''
          new = '''@Composable\nprivate fun MessageBubble(message: Message) {\n    val clipboard = LocalContext.current.getSystemService(ClipboardManager::class.java)\n    fun copy(text: String) {\n        clipboard?.setPrimaryClip(ClipData.newPlainText("Lfm Mobile", text))\n    }\n\n    Column(Modifier.fillMaxWidth(), verticalArrangement = Arrangement.spacedBy(7.dp)) {\n        if (!message.user && message.thinking.isNotEmpty()) {\n            Surface(\n                modifier = Modifier.fillMaxWidth(),\n                shape = RoundedCornerShape(14.dp),\n                color = MaterialTheme.colorScheme.surfaceVariant.copy(alpha = 0.55f)\n            ) {\n                Column(Modifier.padding(horizontal = 14.dp, vertical = 10.dp)) {\n                    Row(Modifier.fillMaxWidth(), verticalAlignment = Alignment.CenterVertically) {\n                        Text("Thinking", style = MaterialTheme.typography.labelMedium, fontWeight = FontWeight.SemiBold)\n                        Spacer(Modifier.weight(1f))\n                        TextButton(onClick = { copy(message.thinking) }) { Text("コピー") }\n                    }\n                    Text(message.thinking, Modifier.padding(top = 4.dp), style = MaterialTheme.typography.bodyMedium)\n                }\n            }\n        }\n        Row(Modifier.fillMaxWidth(), horizontalArrangement = if (message.user) Arrangement.End else Arrangement.Start) {\n            if (message.user || message.text.isNotEmpty()) {\n                Surface(\n                    shape = RoundedCornerShape(18.dp),\n                    color = if (message.user) MaterialTheme.colorScheme.primaryContainer else MaterialTheme.colorScheme.surfaceVariant\n                ) {\n                    Text(message.text, Modifier.padding(horizontal = 16.dp, vertical = 11.dp), style = MaterialTheme.typography.bodyLarge)\n                }\n            }\n        }\n        if (!message.user && message.text.isNotEmpty()) {\n            Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.Start) {\n                TextButton(onClick = { copy(message.text) }) { Text("回答をコピー") }\n            }\n        }\n        if (!message.user && message.sources.isNotEmpty()) {\n            Text(\n                "Sources: " + message.sources.mapIndexed { i, s -> "[${i + 1}] ${s.title}" }.joinToString(" • "),\n                Modifier.padding(start = 10.dp, top = 4.dp), style = MaterialTheme.typography.labelSmall\n            )\n        }\n    }\n}'''
          if old not in s:
              raise SystemExit('MessageBubble block not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Verify UI changes
        run: |
          grep -q 'var draftEnabled' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          grep -q 'Switch(checked = draftEnabled' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          grep -q 'Text("コピー")' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          grep -q 'Text("回答をコピー")' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          ! grep -q 'stats.gpu' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          ! grep -q 'onStats = { tokPerSec, elapsedMs, gpu' app/src/main/java/com/example/lfmmobile/MainActivity.kt

      - name: Commit UI changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/example/lfmmobile/MainActivity.kt
          git diff --cached --quiet && exit 0
          git commit -m "Add draft toggle and response copy buttons"
          git push origin main

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/ui-features.yml
          git commit -m "Remove temporary UI patch workflow"
          git push origin main
