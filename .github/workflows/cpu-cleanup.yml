name: CPU-only cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch native engine
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('app/src/main/cpp/native-lib.cpp')
          s=p.read_text()
          s=s.replace('#include "ggml-backend.h"\n','')
          s=re.sub(r'\nvoid detect_gpu_backend\(\) \{.*?\n\}\n\nstd::vector<common_chat_msg>', '\nstd::vector<common_chat_msg>', s, flags=re.S)
          s=s.replace('llama_backend_init(); g_engine.backend_initialized = true; detect_gpu_backend();','llama_backend_init(); g_engine.backend_initialized = true;')
          s=s.replace('model_params.n_gpu_layers = -1;','model_params.n_gpu_layers = 0;')
          s=s.replace('spec_params.speculative.draft.n_gpu_layers = -1;','spec_params.speculative.draft.n_gpu_layers = 0;')
          s=s.replace('LOGI("[load] model load starting (Vulkan GPU offload requested)");','LOGI("[load] model load starting (CPU-only)");')
          p.write_text(s)
      - name: Verify
        run: |
          set -e
          ! grep -nE 'GGML_VULKAN|ggml-vulkan|Vulkan|vulkan|n_gpu_layers[[:space:]]*=[[:space:]]*-1|detect_gpu_backend|ggml_backend_dev_' app/src/main/cpp/native-lib.cpp app/src/main/cpp/CMakeLists.txt
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/native-lib.cpp
          git commit -m 'Remove GPU runtime code from native engine'
          git push
          git rm .github/workflows/cpu-cleanup.yml
          git commit -m 'Remove one-time CPU cleanup workflow'
          git push
