name: Fix reasoning stream start

on:
  push:
    paths:
      - '.github/workflows/thinking-start-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor shared generation path
        run: |
          python3 .github/scripts/refactor_shared_generation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/native-lib.cpp app/src/main/cpp/tool-calling.cpp
          git commit -m 'Unify normal and tool generation paths'
          git push
