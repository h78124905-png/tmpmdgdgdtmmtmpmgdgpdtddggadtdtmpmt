name: Fix native streaming callback

on:
  push:
    paths:
      - '.github/workflows/native-stream-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove duplicate stream emission
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('app/src/main/cpp/native-lib.cpp')
          s = p.read_text()
          old = '''        const std::string result = generate_impl(env, prompt_text, max_tokens, callback);
          if (callback && !result.empty()) {
              jclass callback_class = env->GetObjectClass(callback);
              const jmethodID on_token = env->GetMethodID(callback_class, "onToken", "(Ljava/lang/String;)V");
              env->DeleteLocalRef(callback_class);
              if (on_token) { jstring jresult = utf8_to_jstring(env, result); env->CallVoidMethod(callback, on_token, jresult); env->DeleteLocalRef(jresult); if (env->ExceptionCheck()) env->ExceptionClear(); }
              else if (env->ExceptionCheck()) env->ExceptionClear();
          }
'''
          new = '''        generate_impl(env, prompt_text, max_tokens, callback);
'''
          if old not in s:
              raise SystemExit('duplicate callback block not found')
          p.write_text(s.replace(old, new, 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/native-lib.cpp
          git commit -m 'Prevent duplicate streamed output' || true
          git push
