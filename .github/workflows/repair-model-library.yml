name: Repair model library

on:
  push:
    paths:
      - '.github/workflows/repair-model-library.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refactor shared generation path
        run: |
          python3 .github/scripts/refactor_shared_generation.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/cpp/native-lib.cpp app/src/main/cpp/tool-calling.cpp
          git commit -m 'Unify normal and tool generation paths'
          git push
      - name: Build Android release
        run: ./gradlew :app:assembleRelease --no-daemon
      - name: Remove one-shot workflow and script
        if: success()
        run: |
          git rm .github/workflows/repair-model-library.yml .github/scripts/refactor_shared_generation.py
          git commit -m 'Remove one-shot shared generation refactor'
          git push
