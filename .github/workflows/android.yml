name: Android

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Install Gradle 8.13
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build signed release APK
        run: |
          gradle --no-daemon clean assembleRelease

      - name: Verify APK signature
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"

          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -x "$APKSIGNER" || chmod +x "$APKSIGNER"

          "$APKSIGNER" verify --verbose "$APK"
          echo "Signed APK: $APK"
          echo "Verified with: $APKSIGNER"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lfm-mobile-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
