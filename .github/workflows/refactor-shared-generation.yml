name: Refactor shared generation
on:
  push:
    paths:
      - .shared-generation-trigger
permissions:
  contents: write
jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Refactor native generation
        shell: python
        run: |
          from pathlib import Path

          root = Path('.')
          native = root / 'app/src/main/cpp/native-lib.cpp'
          tool = root / 'app/src/main/cpp/tool-calling.cpp'

          s = native.read_text(encoding='utf-8')
          if '#include <functional>' not in s:
              s = s.replace('#include <exception>\n', '#include <exception>\n#include <functional>\n', 1)

          sig = 'std::string generate_impl(JNIEnv * env, const std::string & prompt_text, int max_tokens, jobject callback) {'
          start = s.index(sig)
          brace = s.index('{', start)
          depth = 0
          end = None
          for i in range(brace, len(s)):
              if s[i] == '{': depth += 1
              elif s[i] == '}':
                  depth -= 1
                  if depth == 0:
                      end = i + 1
                      break
          if end is None:
              raise SystemExit('could not find generate_impl end')
          old = s[start:end]
          marker = '    jmethodID on_token = nullptr; jmethodID on_stats = nullptr;'
          marker_pos = old.index(marker)
          core = old[marker_pos:]
          core = core.replace(
              '    // Baseline conversation path: always start from a clean KV state.',
              '    if (progress) progress("kv_clear");\n\n    // Shared generation path: always start from a clean KV state.',
              1)
          core = core.replace(
              '    const auto prefill_start = std::chrono::steady_clock::now();',
              '    if (progress) progress("prefill");\n    const auto prefill_start = std::chrono::steady_clock::now();',
              1)
          core = core.replace(
              '    LOGI("[prefill] completed prompt_tokens=%zu elapsed_ms=%lld speed=%.2f tok/s", input.size(), static_cast<long long>(prefill_ms), prefill_ms > 0 ? static_cast<double>(to_eval) * 1000.0 / prefill_ms : 0.0);',
              '    LOGI("[prefill] completed prompt_tokens=%zu elapsed_ms=%lld speed=%.2f tok/s", input.size(), static_cast<long long>(prefill_ms), prefill_ms > 0 ? static_cast<double>(to_eval) * 1000.0 / prefill_ms : 0.0);\n    if (progress) progress("prefill_complete");',
              1)
          core = core.replace(
              '    std::string output; std::string utf8_pending;',
              '    if (progress) progress("generation");\n    std::string output; std::string utf8_pending;',
              1)

          helper_prefix = '''std::string generate_chat_impl(JNIEnv * env, const common_chat_params & chat_params, const llama_tokens & input, int max_tokens, jobject callback, const std::function<void(const char *)> & progress) {
    if (!g_engine.model || !g_engine.context) return "[model not loaded]";
    if (input.empty()) return {};
    if (input.size() + 1 >= llama_n_ctx(g_engine.context)) return "[prompt exceeds context]";
    if (progress) progress("sampler_init");
    common_params_sampling sampling;
    sampling.temp = 0.7f; sampling.top_k = 40; sampling.top_p = 0.95f;
    g_engine.sampler.reset(common_sampler_init(g_engine.model, sampling));
    if (!g_engine.sampler) return "[sampler init failed]";
'''
          helper = helper_prefix + core

          wrapper = '''std::string generate_impl(JNIEnv * env, const std::string & prompt_text, int max_tokens, jobject callback) {
    if (!g_engine.model || !g_engine.context) return "[model not loaded]";
    if (prompt_text.empty()) return {};

    auto messages = build_messages(prompt_text);
    if (messages.size() <= 1) return "[chat format failed: no user message]";
    auto templates = common_chat_templates_init(g_engine.model, "");
    if (!templates) return "[chat template init failed]";
    common_chat_templates_inputs chat_inputs;
    chat_inputs.messages = std::move(messages);
    chat_inputs.add_generation_prompt = true;
    chat_inputs.use_jinja = true;
    chat_inputs.enable_thinking = true;
    const common_chat_params chat_params = common_chat_templates_apply(templates.get(), chat_inputs);
    if (chat_params.prompt.empty()) return "[chat template produced an empty prompt]";

    const llama_tokens input = common_tokenize(g_engine.context, chat_params.prompt, true, true);
    if (input.empty()) return "[tokenization failed]";
    return generate_chat_impl(env, chat_params, input, max_tokens, callback, {});
}'''
          s = s[:start] + helper + '\n\n' + wrapper + s[end:]
          native.write_text(s, encoding='utf-8')

          t = tool.read_text(encoding='utf-8')
          tsig = 'extern "C" JNIEXPORT jstring JNICALL\nJava_com_example_lfmmobile_LlamaEngine_nativeGenerateToolStep'
          tstart = t.index(tsig)
          tbrace = t.index('{', tstart)
          tdepth = 0
          tend = None
          for i in range(tbrace, len(t)):
              if t[i] == '{': tdepth += 1
              elif t[i] == '}':
                  tdepth -= 1
                  if tdepth == 0:
                      tend = i + 1
                      break
          if tend is None:
              raise SystemExit('could not find nativeGenerateToolStep end')

          new_tool = r'''extern "C" JNIEXPORT jstring JNICALL
Java_com_example_lfmmobile_LlamaEngine_nativeGenerateToolStep(JNIEnv * env, jobject, jstring messages_json, jstring tools_json, jint max_tokens, jobject callback) {
    std::string stage = "entry";
    try {
        auto get_string = [&](jstring value)->std::string {
            if (!value) return {};
            const jsize n = env->GetStringLength(value);
            const jchar * p = env->GetStringChars(value, nullptr);
            if (!p) { if (env->ExceptionCheck()) env->ExceptionClear(); throw std::runtime_error("JNI GetStringChars failed"); }
            std::string r; r.reserve(static_cast<size_t>(n) * 2);
            for (jsize i = 0; i < n; ++i) {
                uint32_t cp = p[i];
                if (cp >= 0xD800 && cp <= 0xDBFF && i + 1 < n && p[i + 1] >= 0xDC00 && p[i + 1] <= 0xDFFF) cp = 0x10000 + ((cp - 0xD800) << 10) + (p[++i] - 0xDC00);
                if (cp <= 0x7f) r.push_back((char)cp);
                else if (cp <= 0x7ff) { r.push_back((char)(0xc0 | (cp >> 6))); r.push_back((char)(0x80 | (cp & 63))); }
                else if (cp <= 0xffff) { r.push_back((char)(0xe0 | (cp >> 12))); r.push_back((char)(0x80 | ((cp >> 6) & 63))); r.push_back((char)(0x80 | (cp & 63))); }
                else { r.push_back((char)(0xf0 | (cp >> 18))); r.push_back((char)(0x80 | ((cp >> 12) & 63))); r.push_back((char)(0x80 | ((cp >> 6) & 63))); r.push_back((char)(0x80 | (cp & 63))); }
            }
            env->ReleaseStringChars(value, p);
            return r;
        };
        report_progress(env, callback, "parse_inputs", 0);
        if (!g_engine.model || !g_engine.context || !g_engine.vocab) return tool_result(env, make_error("model not loaded"));
        const common_json messages_value = common_json::parse(get_string(messages_json));
        const common_json tools_value = common_json::parse(get_string(tools_json));
        report_progress(env, callback, "parse_messages", 0);
        const auto messages = common_chat_msgs_parse_oaicompat(messages_value);
        report_progress(env, callback, "parse_tools", 0);
        const auto tools = common_chat_tools_parse_oaicompat(tools_value);
        if (tools.empty()) return tool_result(env, make_error("no tools supplied"));

        report_progress(env, callback, "chat_template_apply", 0);
        auto templates = common_chat_templates_init(g_engine.model, "");
        if (!templates) return tool_result(env, make_error("chat template init failed"));
        common_chat_templates_inputs inputs;
        inputs.messages = messages;
        inputs.tools = tools;
        inputs.tool_choice = COMMON_CHAT_TOOL_CHOICE_AUTO;
        inputs.parallel_tool_calls = false;
        inputs.add_generation_prompt = true;
        inputs.use_jinja = true;
        inputs.enable_thinking = true;
        const common_chat_params chat = common_chat_templates_apply(templates.get(), inputs);
        if (chat.prompt.empty()) return tool_result(env, make_error("empty chat prompt"));

        report_progress(env, callback, "tokenize_tool_prompt", 0);
        const llama_tokens input = common_tokenize(g_engine.context, chat.prompt, true, true);
        if (input.empty()) return tool_result(env, make_error("tool prompt tokenization failed"));

        auto progress = [&](const char * s) { report_progress(env, callback, s, 0); };
        const std::string generated = generate_chat_impl(env, chat, input, std::max(1, std::min((int)max_tokens, 256)), nullptr, progress);
        if (generated.rfind("[", 0) == 0) return tool_result(env, make_error(generated));

        report_progress(env, callback, "parse_generated_tool_call", 0);
        common_chat_parser_params parser(chat);
        parser.parse_tool_calls = true;
        const common_chat_msg parsed = common_chat_parse(generated, false, parser);
        const std::string result = parsed.tool_calls.empty() ? make_final(parsed) : make_tools(parsed);
        report_progress(env, callback, "complete", 0);
        return tool_result(env, result);
    } catch (const std::exception & e) {
        return tool_result(env, make_error("native tool-step exception at " + stage + ": " + (e.what() && *e.what() ? e.what() : "<empty what()>")));
    } catch (...) {
        return tool_result(env, make_error("native tool-step unknown exception at " + stage));
    }
}'''
          t = t[:tstart] + new_tool + t[tend:]
          tool.write_text(t, encoding='utf-8')

          # The old ToolTiming payload is no longer valid because generation timing is shared.
          # Keep ToolAgent's existing optional timing parsing harmless by returning no timing field.

          # Validate that exactly one shared helper exists and the old tool sampler path is gone.
          ns = native.read_text(encoding='utf-8')
          ts = tool.read_text(encoding='utf-8')
          assert ns.count('std::string generate_chat_impl(') == 1
          assert ns.count('std::string generate_impl(') == 1
          assert 'sampling.grammar' not in ts
          assert 'common_sampler_init(g_engine.model, sampling)' not in ts
          assert 'llama_memory_clear(llama_get_memory(g_engine.context)' not in ts

      - name: Commit refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/cpp/native-lib.cpp app/src/main/cpp/tool-calling.cpp
          git commit -m "Unify normal and tool generation paths"
          git push
