name: Fix draft and copy UI build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  fix-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Fix MainActivity stats callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/src/main/java/com/example/lfmmobile/MainActivity.kt')
          s = p.read_text()
          old = '''onStats = { tokPerSec, elapsedMs, contextUsed, contextMax ->
                                channel.trySend(StreamEvent.Stats(GenerationStats(tokPerSec, elapsedMs, contextUsed, contextMax)))
                            }'''
          new = '''onStats = { tokPerSec, elapsedMs, contextUsed, contextMax ->
                                channel.trySend(StreamEvent.Stats(GenerationStats(tokPerSec, elapsedMs, contextUsed, contextMax)))
                            }'''
          if old not in s:
              raise SystemExit('expected callback block not found')
          # The source already uses the 4-argument callback. Verify the file has no old 5-argument form.
          if 'onStats = { tokPerSec, elapsedMs, gpu,' in s or 'onStats = { tokPerSec, elapsedMs, gpu:' in s:
              raise SystemExit('old GPU callback still present')
          p.write_text(s)
          PY

      - name: Verify requested UI
        run: |
          grep -q 'var draftEnabled' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          grep -q 'Switch(checked = draftEnabled' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          grep -q 'copy(message.thinking)' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          grep -q 'copy(message.text)' app/src/main/java/com/example/lfmmobile/MainActivity.kt
          grep -q 'DSpark draft (optional)' app/src/main/java/com/example/lfmmobile/MainActivity.kt

      - name: Build release APK
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon

      - name: Commit verified source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/lfmmobile/MainActivity.kt
          if ! git diff --cached --quiet; then git commit -m 'Verify draft toggle and copy controls'; git push; else echo 'No source changes required'; fi

      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/fix-draft-copy-build.yml
          git commit -m 'Remove temporary UI verification workflow'
          git push