name: Fix thinking separation

on:
  push:
    paths:
      - '.github/workflows/fix-thinking-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix ThinkStreamParser and native stream duplication
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('app/src/main/java/com/example/lfmmobile/MainActivity.kt')
          s = p.read_text()
          start = s.index('private class ThinkStreamParser {')
          end = s.index('\n\nprivate fun loadConversations', start)
          new = r'''private class ThinkStreamParser {
              private enum class Mode { UNKNOWN, THINKING, ANSWERING }
              private var mode = Mode.UNKNOWN
              private var pending = ""

              data class Emission(val thinking: String = "", val answer: String = "")

              private val openingMarkers = listOf(
                  "<think>",
                  "<|think|>",
                  "<|thinking|>",
                  "<|assistant_thinking|>"
              )
              private val closingMarkers = listOf(
                  "</think>",
                  "</thinking>",
                  "<|/think|>",
                  "<|/thinking|>",
                  "<|end_think|>",
                  "<|end_thinking|>"
              )

              private fun earliestMarker(text: String, markers: List<String>): Pair<Int, String>? {
                  var best: Pair<Int, String>? = null
                  for (marker in markers) {
                      val index = text.indexOf(marker)
                      if (index >= 0 && (best == null || index < best!!.first)) best = index to marker
                  }
                  return best
              }

              fun consume(chunk: String): Emission {
                  pending += chunk
                  var thinkingOut = ""
                  var answerOut = ""

                  while (pending.isNotEmpty()) {
                      val open = earliestMarker(pending, openingMarkers)
                      val close = earliestMarker(pending, closingMarkers)

                      when (mode) {
                          Mode.UNKNOWN -> when {
                              open != null && (close == null || open.first <= close.first) -> {
                                  // Text before an explicit opening marker is normal answer text.
                                  if (open.first > 0) answerOut += pending.substring(0, open.first)
                                  pending = pending.substring(open.first + open.second.length)
                                  mode = Mode.THINKING
                              }
                              close != null -> {
                                  // Some LFM templates emit reasoning without an opening marker.
                                  // Keep ALL preceding text buffered until the closing marker is seen;
                                  // otherwise reasoning gets irreversibly emitted as the answer.
                                  if (close.first > 0) thinkingOut += pending.substring(0, close.first)
                                  pending = pending.substring(close.first + close.second.length)
                                  mode = Mode.ANSWERING
                              }
                              else -> {
                                  // Do not classify unknown text as answer yet. The next chunks may
                                  // reveal a closing-only reasoning block. Only marker prefixes are
                                  // relevant here; ordinary text remains buffered until finish().
                                  break
                              }
                          }
                          Mode.THINKING -> {
                              if (close != null) {
                                  if (close.first > 0) thinkingOut += pending.substring(0, close.first)
                                  pending = pending.substring(close.first + close.second.length)
                                  mode = Mode.ANSWERING
                              } else {
                                  val partial = partialMarkerLength(pending, closingMarkers)
                                  val emitLength = pending.length - partial
                                  if (emitLength > 0) {
                                      thinkingOut += pending.substring(0, emitLength)
                                      pending = pending.substring(emitLength)
                                  }
                                  break
                              }
                          }
                          Mode.ANSWERING -> {
                              if (open != null) {
                                  if (open.first > 0) answerOut += pending.substring(0, open.first)
                                  pending = pending.substring(open.first + open.second.length)
                                  mode = Mode.THINKING
                              } else {
                                  val partial = partialMarkerLength(pending, openingMarkers)
                                  val emitLength = pending.length - partial
                                  if (emitLength > 0) {
                                      answerOut += pending.substring(0, emitLength)
                                      pending = pending.substring(emitLength)
                                  }
                                  break
                              }
                          }
                      }
                  }
                  return Emission(thinkingOut, answerOut)
              }

              private fun partialMarkerLength(text: String, markers: List<String>): Int {
                  var keep = 0
                  for (marker in markers) {
                      for (length in 1 until marker.length) {
                          if (text.endsWith(marker.substring(0, length))) keep = maxOf(keep, length)
                      }
                  }
                  return keep
              }

              fun finish(): Emission {
                  val rest = pending
                  pending = ""
                  return when (mode) {
                      Mode.THINKING -> Emission(thinking = rest)
                      Mode.UNKNOWN, Mode.ANSWERING -> Emission(answer = rest)
                  }
              }
          }'''
          p.write_text(s[:start] + new + s[end:])

          p = Path('app/src/main/cpp/native-lib.cpp')
          s = p.read_text()
          old = '''        const std::string result = generate_impl(env, prompt_text, max_tokens, callback);\n        if (callback && !result.empty()) {\n            jclass callback_class = env->GetObjectClass(callback);\n            const jmethodID on_token = env->GetMethodID(callback_class, "onToken", "(Ljava/lang/String;)V");\n            env->DeleteLocalRef(callback_class);\n            if (on_token) { jstring jresult = utf8_to_jstring(env, result); env->CallVoidMethod(callback, on_token, jresult); env->DeleteLocalRef(jresult); if (env->ExceptionCheck()) env->ExceptionClear(); }\n            else if (env->ExceptionCheck()) env->ExceptionClear();\n        }'''
          new = '''        // generate_impl already emits every generated piece through onToken().\n        // Do not send the accumulated result again here: that duplicates the\n        // complete response after the streaming pass and confuses the parser/UI.\n        (void) generate_impl(env, prompt_text, max_tokens, callback);'''
          if old not in s:
              raise SystemExit('native stream tail not found; refusing to modify partial source')
          p.write_text(s.replace(old, new, 1))

          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app/src/main/java/com/example/lfmmobile/MainActivity.kt app/src/main/cpp/native-lib.cpp
          git commit -m 'Fix streaming thinking separation and duplicate output' || true
          git push
