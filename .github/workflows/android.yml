name: Android

on:
  push:
    branches: [main, gpu-vulkan-fix]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Install Vulkan build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y glslc spirv-headers ninja-build

          # Keep both Vulkan-Hpp and SPIR-V headers in the workspace so the
          # Android cross compiler never needs to search the host /usr/include.
          git clone --depth 1 https://github.com/KhronosGroup/Vulkan-Headers.git "$GITHUB_WORKSPACE/Vulkan-Headers"
          cp -a /usr/include/spirv "$GITHUB_WORKSPACE/spirv"

          test -f "$GITHUB_WORKSPACE/Vulkan-Headers/include/vulkan/vulkan.h"
          test -f "$GITHUB_WORKSPACE/Vulkan-Headers/include/vulkan/vulkan.hpp"
          test -f "$GITHUB_WORKSPACE/spirv/unified1/spirv.hpp"
          test -f /usr/share/cmake/SPIRV-Headers/SPIRV-HeadersConfig.cmake
          echo "Workspace Vulkan-Headers and SPIR-V dependencies verified"

          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          NDK="$SDK_ROOT/ndk/27.2.12479018"
          test -f "$NDK/shader-tools/linux-x86_64/glslc"
          test -f "$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libvulkan.so"
          echo "Android NDK Vulkan dependencies verified"

      - name: Locate Android Build Tools
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK_ROOT"
          APKSIGNER="$(find "$SDK_ROOT/build-tools" -type f -name apksigner -perm -111 | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "$(dirname "$APKSIGNER")" >> "$GITHUB_PATH"
          "$APKSIGNER" --version

      - name: Install Gradle 8.13
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Opt in to Material3 experimental API
        shell: bash
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/example/lfmmobile/MainActivity.kt"
          test -f "$FILE"
          if ! grep -q 'androidx.compose.material3.ExperimentalMaterial3Api' "$FILE"; then
            sed -i '1i @file:OptIn(androidx.compose.material3.ExperimentalMaterial3Api::class)' "$FILE"
          fi

      - name: Force Vulkan GPU binding
        run: |
          python3 scripts/force_vulkan_gpu.py
          grep -n "forcing Vulkan device" app/src/main/cpp/native-lib.cpp

      - name: Build release APK
        run: |
          gradle --no-daemon clean assembleRelease --stacktrace

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          "$APKSIGNER" verify --verbose "$APK"
          echo "Signed APK verified: $APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: lfm-mobile-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
