name: Fix draft and copy UI build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify requested UI
        run: |
          set -euo pipefail
          FILE="app/src/main/java/com/example/lfmmobile/MainActivity.kt"
          test -f "$FILE"
          grep -q 'var draftEnabled' "$FILE"
          grep -q 'DSpark draft (optional)' "$FILE"
          grep -q 'copy(message.thinking)' "$FILE"
          grep -q 'copy(message.text)' "$FILE"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.31.6"

      - name: Install Gradle 8.13
        run: |
          curl -L --fail -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.13-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.13/bin" >> "$GITHUB_PATH"

      - name: Build release APK
        run: |
          gradle --no-daemon clean assembleRelease --stacktrace
